# tmux config. Cheat sheet: docs/tmux-tips.md in the dot-files repo
# Reload after editing: tmux source-file ~/.config/tmux/tmux.conf

# --- Recommended for Neovim -------------------------------------------------

# Without this, Neovim's 'autoread' and focus events don't work in tmux
# (:checkhealth warns about it).
set -g focus-events on

# Scrollback: default is 2000 lines
set -g history-limit 5000

# Number windows and panes from 1 so they match the keyboard row
set -g base-index 1
setw -g pane-base-index 1
# Close gaps in window numbers when one is closed
set -g renumber-windows on


# P h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Plugins (TPM) -----------------------------------------------------------
# prefix I = install, prefix U = update, prefix alt-u = remove unlisted

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane defaults (never overrides the settings above)
set -g @plugin 'tmux-plugins/tmux-resurrect'  # prefix C-s = save, prefix C-r = restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-saves sessions every 15 minutes
set -g @continuum-restore 'on'                 # restore the last save when the tmux server starts
set -g @plugin 'christoomey/vim-tmux-navigator' # C-h/j/k/l move across tmux panes AND Neovim splits

# vim-tmux-navigator takes C-l, so "clear screen" moves to prefix C-l
bind C-l send-keys 'C-l'

# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
